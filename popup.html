<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>简填</title><link rel="stylesheet" href="popup.css"></head><body>
  <main class="shell">
    <header class="topbar"><div class="brand"><img src="icon.svg"><div><strong>简填</strong><span>网申助手</span></div></div><button id="openOptions" class="icon-btn" title="编辑资料">⚙</button></header>
    <section class="hero"><div class="eyebrow">READY TO APPLY <i></i></div><h1>把时间留给<br><em>更重要的事。</em></h1><p>资料保存在本地，打开网申页面后即可快速填入。</p><button id="fillPage" class="primary">✦ 一键填充当前页面 <span>⌘ ↵</span></button></section>
    <section class="status-card"><div class="status-dot"></div><div><b id="profileName">还没有资料</b><p id="profileMeta">先完善你的基础信息</p></div><button id="editProfile">编辑</button></section>
    <section class="quick"><div class="section-head"><h2>常用字段</h2><span id="fieldCount">0 / 12 已完成</span></div><div id="quickFields" class="field-grid"></div></section>
    <footer><span>仅在当前页面操作</span><span>·</span><span>仅保存在本地</span></footer>
  </main><div id="toast" class="toast"></div><script src="storage.js"></script><script src="fill.js"></script><script src="popup.js"></script></body></html>
