<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>简填自动填写测试</title><body><h1>模拟网申表单</h1><div class="form-row"><label for="applicant">姓名</label><input id="applicant"></div><div class="form-row"><span id="schoolLabel">毕业院校</span><input aria-labelledby="schoolLabel"></div><div class="form-row"><label>政治面貌 <select id="political"><option>请选择</option><option>中共党员</option><option>共青团员</option></select></label></div><div class="form-row"><label for="phone">联系电话</label><input id="phone"></div><div class="form-row"><label for="project">项目经历</label><textarea id="project"></textarea></div><button id="run">运行自动填写测试</button><p id="result"></p><script src="../fill.js"></script><script>document.querySelector('#run').onclick=()=>{const n=JobFill.fillPage({name:'测试同学',school:'测试大学',politicalStatus:'中共党员',phone:'13800138000',projects:'项目 A：自动填充测试'});document.querySelector('#result').textContent=`已填充 ${n} 个字段｜${document.querySelector('#applicant').value}｜${document.querySelector('#political').value}`}</script></body></html>
